<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Boxing-window card icon (v7.51). Full bleed: the device applies its own rounded mask.
       Fonts: Alfa Slab One + Oswald Bold, bundled in ../fonts. -->
  <rect width="1024" height="1024" fill="#fbf6e8"/>
  <!-- top red band -->
  <rect width="1024" height="318" fill="#c8231b"/>
  <text x="512" y="236" fill="#ffd400" font-family="Oswald" font-weight="700" font-size="150" text-anchor="middle" textLength="760" lengthAdjust="spacingAndGlyphs">STURGEON BAY</text>
  <rect y="318" width="1024" height="26" fill="#161616"/>
  <!-- headline with offset print -->
  <text x="526" y="694" fill="#c8231b" font-family="Alfa Slab One" font-size="330" text-anchor="middle" textLength="800" lengthAdjust="spacingAndGlyphs">SLAM</text>
  <text x="512" y="680" fill="#161616" font-family="Alfa Slab One" font-size="330" text-anchor="middle" textLength="800" lengthAdjust="spacingAndGlyphs">SLAM</text>
  <!-- bottom blue band with stars -->
  <rect y="758" width="1024" height="26" fill="#161616"/>
  <rect y="784" width="1024" height="240" fill="#1b3f8b"/>
  <g fill="#ffd400">
    <path id="s" d="M0-46 13-15 48-15 20 6 31 41 0 21-31 41-20 6-48-15-13-15Z" transform="translate(332 900)"/>
    <use href="#s" transform="translate(180 0)"/>
    <use href="#s" transform="translate(360 0)"/>
  </g>
</svg>
